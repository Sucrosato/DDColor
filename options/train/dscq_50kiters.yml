# ================================================================
# DDColor DINOv3 ViT + SDT -- training config
# Frozen DINOv3 ViT/S encoder + SDT decoder for colorization
# ================================================================

# general settings
name: dscq-s
model_type: ColorModel
scale: 1
num_gpu: 1
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: COCO
    type: LabDataset
    dataroot_gt: /public/home/lyzhao/dychen/data/train_small/
    meta_info_file: ['data_list/coco_train_10k.txt']
    io_backend:
      type: disk

    gt_size: 256

    # augmentation config
    use_hflip: true
    use_rot: false

    # cutmix / fmix (disable for small datasets)
    do_cutmix: false
    do_fmix: false

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: imagenet_val5k
    type: LabDataset
    dataroot_gt: /public/home/lyzhao/dychen/data/imagenet5k/
    meta_info_file: 'data_list/imagenet5k.txt'
    gt_size: 256
    io_backend:
      type: disk
    do_cutmix: false
    do_fmix: false

# ================================================================
# network structures -- DINOv3 ViT + SDT
# ================================================================
network_g:
  type: DDColor_DinoV3_SDT

  model_name: vit_small
  input_size: [256, 256]
  fusion_channels: 256
  num_output_channels: 2
  do_normalize: true

  backbone_out_layers: FOUR_EVEN_INTERVALS
  adapt_to_patch_size: center_padding

  # Color Query Bottleneck
  use_color_queries: true
  num_queries: 100
  query_layers: 3

network_d:
  type: DynamicUNetDiscriminator
  nf: 64
  n_channels: 3

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# ================================================================
# training settings
# ================================================================
train:
  color_enhance: true
  color_enhance_factor: 1.2

  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0.01
    betas: [0.9, 0.99]
  optim_d:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [10000, 20000, 30000, 40000]
    gamma: 0.5

  total_iter: 50000
  warmup_iter: -1

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 0.1
    reduction: mean
  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      'conv1_1': 0.0625
      'conv2_1': 0.125
      'conv3_1': 0.25
      'conv4_1': 0.5
      'conv5_1': 1.0
    vgg_type: vgg16_bn
    use_input_norm: true
    range_norm: false
    perceptual_weight: 5.0
    style_weight: 0
    criterion: l1
  gan_opt:
    type: GANLoss
    gan_type: vanilla
    real_label_val: 1.0
    fake_label_val: 0.0
    loss_weight: 1.0
  colorfulness_opt:
    type: ColorfulnessLoss
    loss_weight: 0.5

# validation settings
val:
  val_freq: !!float 5000
  save_img: false
  pbar: true

  metrics:
    fid:                    
      type: ~  
    cf:
      type: calculate_cf
      better: higher
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

# logging
logger:
  print_freq: 50
  save_snapshot_freq: !!float 2000
  save_snapshot_verbose: true
  save_checkpoint_freq: !!float 5000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist settings
dist_params:
  backend: nccl
  port: 29500
